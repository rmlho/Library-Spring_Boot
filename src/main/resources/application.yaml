spring:
  application:
    name: library

  datasource:
    url: jdbc:postgresql://localhost:5432/db_library
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000

  logging:
    level:
      root: INFO
      com.ramalho.library: DEBUG
      org.springframework.security: DEBUG

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  config:
    import: optional:file:.env[.properties]

jwt:
  expiration: ${JWT_EXPIRATION:600000} #10 minutes;
  key: ${JWT_KEY}

server:
  port: 8081
